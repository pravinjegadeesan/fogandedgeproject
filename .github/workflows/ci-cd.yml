name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with Ruff
      run: |
        ruff check .

  deploy:
    name: Deploy to AWS
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

    - name: Deploy Lambda functions
      run: |
        zip -j lambda_ingest.zip backend/lambda_ingest.py
        aws lambda update-function-code --function-name SmartHomeEnergyIngest --zip-file fileb://lambda_ingest.zip
        
        zip -j lambda_get.zip backend/lambda_get.py
        aws lambda update-function-code --function-name SmartHomeEnergyGet --zip-file fileb://lambda_get.zip

    - name: Deploy Fog Node to Elastic Beanstalk
      run: |
        zip -r fog_node.zip application.py requirements.txt fog/ frontend/
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        BUCKET_NAME="smarthomeenergyfog-bucket-${ACCOUNT_ID}"
        aws s3 cp fog_node.zip "s3://$BUCKET_NAME/fog_node.zip"
        
        VERSION_LABEL="git-${{ github.sha }}"
        aws elasticbeanstalk create-application-version \
            --application-name SmartHomeEnergyFog \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$BUCKET_NAME,S3Key=fog_node.zip"
            
        aws elasticbeanstalk update-environment \
            --environment-name SmartHomeEnergyFog-env \
            --version-label "$VERSION_LABEL"
